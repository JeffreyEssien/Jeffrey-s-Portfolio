name: Jobs digest email

on:
  schedule:
    # 07:00 + 19:00 WAT (06:00 + 18:00 UTC) daily.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install nodemailer
        run: npm install --no-save nodemailer@^6.9.13
      - name: Send job digest
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          JOBS_CRON_SECRET: ${{ secrets.JOBS_CRON_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          JOBS_DIGEST_TO: ${{ vars.JOBS_DIGEST_TO }}
        run: node scripts/jobs-digest.mjs
